<style>
:root{--bg:#f4f1ec;--card:#fffffe;--ink:#1c1b19;--mute:#8a867e;--line:#e8e3da;--acc:#c8643c;--accsoft:#f6e4da;--shadow:0 8px 30px rgba(40,30,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1b19;--ink:#f3efe8;--mute:#8d887f;--line:#2a2824;--acc:#e07a4f;--accsoft:#2e211a;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1b19;--ink:#f3efe8;--mute:#8d887f;--line:#2a2824;--acc:#e07a4f;--accsoft:#2e211a;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 120px}
h1{font:700 34px/1.1 "New York",Georgia,serif;letter-spacing:-.02em;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 24px;font-size:15px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width .4s}
.add{display:flex;gap:10px;background:var(--card);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:var(--shadow);margin-bottom:22px}
.add input{flex:1;border:0;background:none;color:var(--ink);font:inherit;outline:0;min-width:0}
.add button{border:0;background:var(--acc);color:#fff;border-radius:12px;width:42px;font-size:22px;cursor:pointer}
#list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:2px solid transparent;min-height:96px;cursor:pointer;transition:border-color .2s}
.task.sel{grid-column:1/-1;border-color:var(--acc);padding:16px}
.row{align-items:flex-start}
.empty{grid-column:1/-1}
.row{display:flex;align-items:center;gap:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;cursor:pointer;color:#fff;font-size:15px;line-height:1;padding:0}
.done .chk{background:var(--acc);border-color:var(--acc)}
.txt{flex:1;word-break:break-word}
.done .txt{color:var(--mute);text-decoration:line-through}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px}
.ai{margin-top:10px;border:0;background:var(--accsoft);color:var(--acc);font:600 14px inherit;font-family:inherit;border-radius:999px;padding:8px 14px;cursor:pointer}
.ai:disabled{opacity:.6}
.res{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:15px;white-space:pre-wrap;border-left:3px solid var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
  <h1 id="hi">I dag</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="bar"></i></div>
  <div class="add"><input id="in" placeholder="Ny opgave…" enterkeyhint="done"><button id="addb" aria-label="Tilføj">+</button></div>
  <div id="list"></div>
  <p class="note"><button id="keyb" class="x" style="font-size:13px;text-decoration:underline">API-nøgle</button><br>✦ Tryk på en opgave for at åbne den og lade Claude klare den.</p>
</main>
<script>
var tasks=[],sel=null;
try{tasks=JSON.parse(localStorage.getItem("tasks")||"[]")}catch(e){tasks=[]}
function save(){try{localStorage.setItem("tasks",JSON.stringify(tasks.map(function(t){return {id:t.id,t:t.t,done:t.done,res:t.res}})))}catch(e){}}
var list=document.getElementById("list");
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function render(){
  list.textContent="";
  var d=tasks.filter(function(t){return t.done}).length;
  document.getElementById("bar").style.width=(tasks.length?d/tasks.length*100:0)+"%";
  document.getElementById("sub").textContent=tasks.length?d+" af "+tasks.length+" klaret":"Ingen opgaver endnu";
  if(!tasks.length){list.appendChild(el("div","empty","Tilføj din første opgave ovenfor."));return}
  tasks.forEach(function(t){
    var c=el("div","task"+(t.done?" done":"")+(t.id===sel?" sel":""));c.onclick=function(){sel=(sel===t.id?null:t.id);render()};
    var r=el("div","row");
    var b=el("button","chk",t.done?"✓":"");b.onclick=function(e){e.stopPropagation();t.done=!t.done;save();render()};
    var x=el("button","x","×");x.setAttribute("aria-label","Slet");x.onclick=function(e){e.stopPropagation();tasks=tasks.filter(function(k){return k!==t});if(sel===t.id)sel=null;save();render()};
    r.appendChild(b);r.appendChild(el("div","txt",t.t));if(t.id===sel)r.appendChild(x);c.appendChild(r);
    if(!t.done&&t.id===sel){var a=el("button","ai",t.busy?"Claude arbejder…":(t.res?"✦ Prøv igen med Claude":"✦ Lad Claude klare det"));a.disabled=!!t.busy;a.onclick=function(e){e.stopPropagation();ask(t)};c.appendChild(a)}
    if(t.res&&t.id===sel)c.appendChild(el("div","res",t.res));
    list.appendChild(c)})
}
function getKey(){try{return localStorage.getItem("akey")||""}catch(e){return ""}}
function setKey(){var k=prompt("Indsæt din Anthropic API-nøgle (gemmes kun på denne telefon):",getKey());if(k!==null){try{localStorage.setItem("akey",k.trim())}catch(e){}}}
async function ask(t){
  var key=getKey();
  if(!key){setKey();key=getKey();if(!key)return}
  t.busy=true;t.res="";render();
  try{
    var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1500,tools:[{type:"web_search_20250305",name:"web_search",max_uses:3}],messages:[{role:"user",content:"Du er assistent i en to-do app. Udfør opgaven så godt du kan, på dansk, kort og konkret (højst 150 ord). Brug websøgning, hvis opgaven kræver aktuelle oplysninger.\n\nOpgave: "+t.t}]})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error&&d.error.message||"Ukendt fejl");
    t.res=d.content.map(function(b){return b.type==="text"?b.text:""}).join("").trim()||"Intet svar.";
  }catch(e){t.res="Noget gik galt: "+e.message}
  finally{t.busy=false;save();render()}
}
function add(){var i=document.getElementById("in"),v=i.value.trim();if(!v)return;var n={id:Date.now(),t:v,done:false,res:""};tasks.unshift(n);sel=n.id;i.value="";save();render()}
document.getElementById("addb").onclick=add;
document.getElementById("in").onkeydown=function(e){if(e.key==="Enter")add()};
document.getElementById("keyb").onclick=setKey;
render();
</script>
</body>
</html>
